name: release
# Builds and publishes to PyPI on a v* tag through trusted publishing. The mapper has no MCP server of its own:
# agents reach it through sdc-mapper's (the target `omop`).
# (the project must be registered on PyPI with
# this repository and workflow as a trusted publisher first; until then the tag is the dependency).
on:
  push:
    tags: ["v*"]
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Upgrade pip by hash (eMudhra/emSign CA compromise, October 2026)
        # Older pip vendors a certifi that trusts the compromised emSign root; fetch the fix from a pinned hash.
        run: python -m pip install "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1

