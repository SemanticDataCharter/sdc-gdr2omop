# NHANES Participant (FAIR Data Demo) to OMOP CDM 5.4
# Written by tools/build_mapping.py from tools/specs/nhanes_participant.py; labels in the comments.
mapping:
  id: nhanes-participant-omop-5.4
  version: 1
  author: Axius SDC, Inc.
  date: '2026-10-25'
  description: The NHANES Participant model's values as OMOP CDM 5.4 rows. The concepts are the model's own links and code
    bindings, looked up in the user's vocabulary; the mapping says which table and column.
model:
  ct_id: xy8upneajsb8vdcmnve01g6g
  schema_sha256: 0df45878b0db1c1515e860a4b9993c5f086ffaaebc4c16aaae2092e1da3d3b3b
target:
  name: OMOP CDM
  version: '5.4'
rules:
  # NHANES Participant Governed Record
  - {cluster: l6t9agg233vswxyv60quiu6w, to: .}
  # NHANES Participant
  - {cluster: e3gwv95m8jjx7578urmx8ppz, to: .}
  # Audit Event
  - {cluster: t2tvd3wylxrstdeu5aw6gkw1, to: '-', transform: omit, reason: 'the record''s audit event: OMOP CDM has no table for it'}
  # PROV Activity
  - {cluster: vmikfu0irht9fmq7q02t3oqs, to: '-', transform: omit, reason: 'the record''s provenance: OMOP CDM has no table for it'}
  # PROV Agent
  - {cluster: c179ilk2ns15cd5rzzdfd6f6, to: '-', transform: omit, reason: 'the record''s provenance: OMOP CDM has no table for it'}
  # Respondent Sequence Number (SEQN)
  - {component: uto4zszvpicva38wx77knz5y, to: RECORD/person_id, transform: copy, also: [{to: RECORD/event_date, transform: constant, value: '2017-01-01'}, {to: OBSERVATION_PERIOD/observation_period_start_date, transform: constant, value: '2017-01-01'}, {to: OBSERVATION_PERIOD/observation_period_end_date, transform: constant, value: '2018-12-31'}]}
  # every quantity: a MEASUREMENT row
  - {sdc_type: XdQuantity, to: +MEASUREMENT/value_as_number, transform: copy}
  # every answer: an OBSERVATION row
  - {sdc_type: XdToken, to: +OBSERVATION/value_as_concept_id, transform: copy}
  # every count: an OBSERVATION row
  - {sdc_type: XdCount, to: +OBSERVATION/value_as_number, transform: copy}
  # Ratio of Family Income to Poverty (INDFMPIR)
  - {component: dwd4pk56w0pjchsyzl81fzya, to: +OBSERVATION/value_as_number, transform: copy}
  # Administrative Gender
  - {component: gxzbm758mhdz51xd4bawlfhh, to: PERSON/gender_concept_id, transform: code, table: {male: 'Gender:M', female: 'Gender:F'}, on_miss: omit, also: [{to: PERSON/gender_source_value, transform: copy}]}
  # Gender (RIAGENDR)
  - {component: sigmhjzuw16w0k8op92lk9sd, to: '-', transform: omit, reason: 'PERSON holds one gender, and Administrative Gender is it'}
  # Race/Ethnicity Self-Identification
  - {component: u5tietya3u56hbz2kos06ai7, to: PERSON/race_concept_id, transform: code, table: {American Indian or Alaska Native: 'Race:1', Asian or Asian American: 'Race:2', Black or African American: 'Race:3', Native Hawaiian or Other Pacific Islander: 'Race:4', White: 'Race:5'}, on_miss: omit, also: [{to: PERSON/race_source_value, transform: copy}]}
  # Race/Hispanic Origin with NH Asian (RIDRETH3)
  - {component: hs44ipuqgvc3azbt3mirxtsz, to: PERSON/ethnicity_concept_id, transform: code, table: {Mexican American: 'Ethnicity:Hispanic', Other Hispanic: 'Ethnicity:Hispanic', Non-Hispanic White: 'Ethnicity:Not Hispanic', Non-Hispanic Black: 'Ethnicity:Not Hispanic', Non-Hispanic Asian: 'Ethnicity:Not Hispanic', Other Race - Including Multi-Racial: 'Ethnicity:Not Hispanic'}, also: [{to: PERSON/ethnicity_source_value, transform: copy}]}
  # Age
  - {component: wuvdeiwoe5bna7nlhcl1c4h9, to: PERSON/year_of_birth, transform: code, table: {'0': '2017', '1': '2016', '2': '2015', '3': '2014', '4': '2013', '5': '2012', '6': '2011', '7': '2010', '8': '2009', '9': '2008', '10': '2007', '11': '2006', '12': '2005', '13': '2004', '14': '2003', '15': '2002', '16': '2001', '17': '2000', '18': '1999', '19': '1998', '20': '1997', '21': '1996', '22': '1995', '23': '1994', '24': '1993', '25': '1992', '26': '1991', '27': '1990', '28': '1989', '29': '1988', '30': '1987', '31': '1986', '32': '1985', '33': '1984', '34': '1983', '35': '1982', '36': '1981', '37': '1980', '38': '1979', '39': '1978', '40': '1977', '41': '1976', '42': '1975', '43': '1974', '44': '1973', '45': '1972', '46': '1971', '47': '1970', '48': '1969', '49': '1968', '50': '1967', '51': '1966', '52': '1965', '53': '1964', '54': '1963', '55': '1962', '56': '1961', '57': '1960', '58': '1959', '59': '1958', '60': '1957', '61': '1956', '62': '1955', '63': '1954', '64': '1953', '65': '1952', '66': '1951', '67': '1950', '68': '1949', '69': '1948', '70': '1947', '71': '1946', '72': '1945', '73': '1944', '74': '1943', '75': '1942', '76': '1941', '77': '1940', '78': '1939', '79': '1938', '80': '1937'}}
  # Body Site (SNOMED CT)
  - {cluster: r5koa840csi3zcewts0uo0r5, to: '-', transform: omit, reason: OMOP CDM 5.4 MEASUREMENT has no body site column}
  # Observation Status
  - {component: q9vmn1cvdclgr757aer5v1rg, to: '-', transform: omit, reason: 'OMOP CDM has no status for a measurement: a row is a final result'}
  # Observation Date Time
  - {component: dkyyj01tksb7h7akq2w7moum, to: '-', transform: omit, reason: rows take the record's date; a reading's own time has no row of its own}
  # Data Release Cycle (SDDSRVYR)
  - {component: k52nvzllwurg016nvsulpm32, to: '-', transform: omit, reason: 'the survey''s design describes the sample, not the person; OMOP CDM has no table for it'}
  # Interview/Examination Status (RIDSTATR)
  - {component: j9l0spojx47xnjqipfl9mzte, to: '-', transform: omit, reason: 'the survey''s design describes the sample, not the person; OMOP CDM has no table for it'}
